[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "riskhub"
version = "0.1.0"
description = "Lightweight risk aggregation and remediation governance platform"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic-settings>=2.7,<3",
  "pyjwt>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["apps/api/tests"]
addopts = "-q --disable-warnings"

[tool.coverage.run]
source = ["apps/api/riskhub"]

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["riskhub*"]
